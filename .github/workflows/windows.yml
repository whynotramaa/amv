name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
      - name: Build, check and package
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Install and launch
        shell: pwsh
        run: ./scripts/smoke-windows.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Harness-smoke
          path: smoke/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: Harness-Setup-x64
          path: |
            dist/Harness-Setup-x64.exe
            dist/Harness-Setup-x64.exe.sha256
          if-no-files-found: error
          retention-days: 7
