[env]
# Portable binaries must not inherit the build machine's instruction set.
GGML_NATIVE = "OFF"
GGML_AVX = "OFF"
GGML_AVX2 = "OFF"
GGML_FMA = "OFF"
GGML_F16C = "OFF"
CMAKE_POLICY_DEFAULT_CMP0091 = "NEW"
CMAKE_MSVC_RUNTIME_LIBRARY = "MultiThreaded"

[target.x86_64-pc-windows-msvc]
# A clean Windows installation must not need a separately installed C++ runtime.
rustflags = ["-C", "target-feature=+crt-static"]
